<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Button Hover Effects</title>
    <link rel="stylesheet" href="norm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Project 05</p>
        <h1 id="page-title">CSS Button Hover Effects</h1>
        <p>
          Four animated button states built with pseudo-elements, transforms,
          transitions, and focused CSS selectors.
        </p>
      </section>

      <section class="effects" aria-label="Button hover effect examples">
        <div class="effect-card effect-card--pink">
          <a class="button button--underline" href="#" aria-label="Button hover effect 1">
            BTN 1 HOVER
          </a>
        </div>

        <div class="effect-card effect-card--purple">
          <a class="button button--corners" href="#" aria-label="Button hover effect 2">
            BTN 2 HOVER
          </a>
        </div>

        <div class="effect-card effect-card--yellow">
          <a class="button button--slide" href="#" aria-label="Button hover effect 3">
            BTN 3 HOVER
          </a>
        </div>

        <div class="effect-card effect-card--dark">
          <a class="button button--frame" href="#" aria-label="Button hover effect 4">
            BTN 4 HOVER
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
